name: Engineering checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVERMORE_LIVE_ENABLED: "0"
      EVERMORE_BUDGET_USD: "0"
      CHECKOUT_ENABLED: "false"
      DATA_DIR: .data-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Verify sanitized release package
        run: node --import tsx scripts/package-release.ts ../verified-release
      - name: Build deployable image
        run: docker build --tag everlore:ci .
      - name: Test mounted-disk startup without provider access
        run: |
          docker volume create everlore-ci-data
          docker run --detach --name everlore-ci --publish 10000:10000 --volume everlore-ci-data:/var/data --env DISABLE_WORKER=1 --env PUBLIC_ORIGIN=https://ci.example.invalid everlore:ci
          trap 'docker logs everlore-ci; docker rm --force everlore-ci; docker volume rm everlore-ci-data' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --header 'Host: ci.example.invalid' http://127.0.0.1:10000/healthz; then break; fi
            sleep 1
          done
          docker exec --user node --env EVERLORE_OPERATOR_PASSWORD=synthetic-ci-only-password everlore-ci node --import tsx scripts/operator.ts create ci-operator
          curl --fail --silent --header 'Host: ci.example.invalid' http://127.0.0.1:10000/readyz
          docker exec everlore-ci sh -c 'test "$(stat -c %U /var/data/everlore)" = node'
          expected_code_hash="$(node --import tsx --input-type=module -e 'import { codeHash } from "./src/server/lab/service.ts"; process.stdout.write(codeHash())')"
          docker exec --user node --env EVERLORE_EXPECTED_CODE_HASH="$expected_code_hash" everlore-ci node --import tsx --test tests/hosted-lab.test.ts
